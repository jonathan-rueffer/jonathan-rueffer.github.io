<div class="container-md">
  <div class="row">
    <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
      <div class="contact-bar">
        {% if site.social-network-links.email %}
        <a href="mailto:{{ site.social-network-links.email }}" title="Email me">
          <i class="fas fa-envelope" aria-hidden="true"></i>{{ site.social-network-links.email }}
        </a>
        {% endif %}
        {% if site.social-network-links.linkedin %}
        <a href="https://linkedin.com/in/{{ site.social-network-links.linkedin }}" title="LinkedIn" target="_blank" rel="noopener">
          <i class="fab fa-linkedin" aria-hidden="true"></i>LinkedIn
        </a>
        {% endif %}
        {% if site.social-network-links.github %}
        <a href="https://github.com/{{ site.social-network-links.github }}" title="GitHub" target="_blank" rel="noopener">
          <i class="fab fa-github" aria-hidden="true"></i>GitHub
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</div>

<style>
.contact-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 0.4rem 1.5rem;
  margin: 0 0 1.75rem 0;
}
.contact-bar a {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  color: rgba(255, 255, 255, 0.92);
  font-size: 0.95rem;
  text-decoration: none;
  border-bottom: 1px solid rgba(255, 255, 255, 0.35);
  padding-bottom: 1px;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.contact-bar a:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.9);
}
.contact-bar i {
  font-size: 0.9rem;
  opacity: 0.85;
}
</style>
